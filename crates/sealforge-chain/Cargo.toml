[package]
name = "sealforge-chain"
description = "Chain access for sealForge: escrow wallets synced from a lightwalletd/Zaino server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sealforge-scan.workspace = true
prost = "0.14"
anyhow.workspace = true
async-trait = "0.1"
tokio.workspace = true
tracing.workspace = true
tonic.workspace = true
rusqlite = "0.37"
rand10 = { package = "rand", version = "0.10", features = ["sys_rng"] }
zcash_client_backend = { workspace = true, features = ["lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots", "sync", "orchard", "pczt"] }
pczt = { workspace = true, features = ["orchard", "io-finalizer", "prover", "signer", "spend-finalizer", "tx-extractor"] }
orchard = { workspace = true, features = ["circuit"] }
pasta_curves.workspace = true
zip321 = { version = "=0.10.0-pre.2" }
zcash_address = { version = "=0.14.0-pre.2" }
zcash_client_sqlite = { workspace = true, features = ["orchard", "transparent-inputs", "serde"] }
zcash_keys.workspace = true
zcash_primitives = "=0.31.0-pre.2"
zcash_proofs = { version = "=0.31.0-pre.2", features = ["bundled-prover"], optional = true }
secrecy = "0.8"
zip32 = "0.3"
zcash_note_encryption = "0.5"
zcash_protocol.workspace = true

[features]
# Spending dev wallet for local regtest testing (bundles the Sapling proving parameters).
dev-wallet = ["dep:zcash_proofs"]

[dev-dependencies]
rand.workspace = true
sealforge-escrow = { workspace = true, features = ["address"] }
sealforge-core.workspace = true
hex.workspace = true
serde_json.workspace = true

[[example]]
name = "regtest_bid"
required-features = ["dev-wallet"]

[[example]]
name = "escrow_spend"
