[package]
name = "sealforge-signer-wasm"
description = "Trustee batch signing (2-of-3 FROST) for the browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sealforge-escrow.workspace = true
orchard.workspace = true
sealforge-verify.workspace = true
sealforge-scan.workspace = true
sealforge-api.workspace = true
crypto_box.workspace = true
zcash_protocol.workspace = true
hex.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser randomness (crypto.getRandomValues) for FROST nonces, for every
# getrandom version in the tree.
getrandom = { version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
pasta_curves.workspace = true
