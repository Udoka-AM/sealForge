[workspace]
resolver = "2"
members = [
  "crates/sealforge-core",
  "crates/sealforge-coordinator",
  "crates/sealforge-escrow",
  "crates/sealforge-auditor",
  "crates/sealforge-cli",
  "crates/sealforge-api",
  "crates/sealforge-chain",
  "crates/sealforge-signer-wasm",
  "tools/linkability-harness",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Udoka-AM/sealForge"
authors = ["Udoka-AM"]

[workspace.dependencies]
sealforge-core = { path = "crates/sealforge-core" }
sealforge-escrow = { path = "crates/sealforge-escrow", default-features = false }
sealforge-auditor = { path = "crates/sealforge-auditor" }
sealforge-chain = { path = "crates/sealforge-chain" }
sealforge-api = { path = "crates/sealforge-api" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
blake2b_simd = "1"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "cors"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
wasm-bindgen = "0.2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
crypto_box = { version = "0.9", features = ["seal"] }
toml = "0.8"
sealforge-coordinator = { path = "crates/sealforge-coordinator" }

# Zcash / FROST (task 1.2, verified 2026-10-14; see docs/VERSIONS.md).
# Pre-releases are pinned exactly: they are the first with Ironwood (NU6.3) and NU7 support.
zcash_protocol = { version = "=0.11.0-pre.1", features = ["local-consensus"] }
zcash_client_backend = "=0.25.0-pre.2"
zcash_client_sqlite = "=0.23.0-pre.2"
tonic = "0.14"
zcash_keys = { version = "=0.17.0-pre.2", features = ["orchard", "unstable-frost"] }
pczt = "=0.10.0-pre.2"
orchard = { version = "0.16", default-features = false, features = ["std"] }
pasta_curves = "0.6"
reddsa = "0.6.1"
# FROST(Pallas, BLAKE2b-512) ciphersuite. ZF removed it from reddsa 0.6 and has not
# yet published it in the ZcashFoundation/frost repo, so we use the last ZF release
# that ships it (frost-rerandomized 3.0.0 underneath). Renamed to avoid clashing with reddsa 0.6.
reddsa-frost = { package = "reddsa", version = "=0.5.2", features = ["frost"] }
frost-rerandomized = "=3.0.0"
rand = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release.package.sealforge-auditor]
opt-level = "s"
