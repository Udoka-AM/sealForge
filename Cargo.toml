[workspace]
resolver = "2"
members = [
  "crates/sealforge-core",
  "crates/sealforge-coordinator",
  "crates/sealforge-escrow",
  "crates/sealforge-auditor",
  "crates/sealforge-cli",
  "crates/sealforge-api",
  "crates/sealforge-verify",
  "crates/sealforge-chain",
  "crates/sealforge-signer-wasm",
  "crates/sealforge-scan",
  "crates/sealforge-wallet",
  "tools/linkability-harness",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The toolchain CI builds and tests with (rust-toolchain.toml). Dependencies
# alone need 1.94 or later.
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Udoka-AM/sealForge"
authors = ["Udoka-AM"]
# Not published to crates.io yet; see the roadmap for the packages planned.
publish = false

[workspace.dependencies]
sealforge-core = { path = "crates/sealforge-core" }
sealforge-escrow = { path = "crates/sealforge-escrow", default-features = false }
sealforge-auditor = { path = "crates/sealforge-auditor", default-features = false }
sealforge-chain = { path = "crates/sealforge-chain" }
sealforge-scan = { path = "crates/sealforge-scan" }
sealforge-api = { path = "crates/sealforge-api" }
sealforge-verify = { path = "crates/sealforge-verify" }

anyhow = "1"
bech32 = { version = "0.11", default-features = false, features = ["alloc"] }
zeroize = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
blake2b_simd = "1"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "cors"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
wasm-bindgen = "0.2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.11"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower = { version = "0.5", features = ["util", "limit"] }
governor = "0.10"
http-body-util = "0.1"
crypto_box = { version = "0.9", features = ["seal"] }
toml = "0.8"
sealforge-coordinator = { path = "crates/sealforge-coordinator" }

# Zcash and FROST crates, upgraded together; see docs/VERSIONS.md. librustzcash
# crates are declared without default features so the WASM crates can stay lean;
# each member names the features it uses.
zcash_protocol = { version = "0.11.0", features = ["local-consensus"] }
zcash_address = "0.14.0"
zcash_client_backend = { version = "0.25.0", default-features = false }
zcash_client_sqlite = "0.23.0"
tonic = "0.14"
zcash_keys = { version = "0.17.0", default-features = false, features = ["orchard"] }
zcash_primitives = { version = "0.31.1", default-features = false }
zcash_proofs = "0.31.0"
zip321 = "0.10.0"
pczt = "0.10.0"
orchard = { version = "0.16", default-features = false, features = ["std"] }
pasta_curves = "0.6"
reddsa = "0.6.1"
# FROST(Pallas, BLAKE2b-512) ciphersuite. ZF removed it from reddsa 0.6 and has not
# yet published it in the ZcashFoundation/frost repo, so we use the last ZF release
# that ships it (frost-rerandomized 3.0.0 underneath). Renamed to avoid clashing with reddsa 0.6.
reddsa-frost = { package = "reddsa", version = "=0.5.2", features = ["frost"] }
frost-rerandomized = "=3.0.0"
rand = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release.package.sealforge-auditor]
opt-level = "s"
