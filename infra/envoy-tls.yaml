# gRPC-web proxy in front of a public lightwallet server over TLS (scripts/host-local.sh).
# UPSTREAM_HOST is replaced at start. Only the
# CompactTxStreamer service is routed (read + broadcast).
static_resources:
  listeners:
    - name: grpc_web
      address: { socket_address: { address: 0.0.0.0, port_value: 8081 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: grpc_web
                access_log: [] # no client IPs logged
                route_config:
                  virtual_hosts:
                    - name: zaino
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/cash.z.wallet.sdk.rpc.CompactTxStreamer/" }
                          route: { cluster: zaino, timeout: 0s, max_stream_duration: { grpc_timeout_header_max: 0s } }
                      cors:
                        allow_origin_string_match: [{ safe_regex: { regex: ".*" } }]
                        allow_methods: "GET, PUT, DELETE, POST, OPTIONS"
                        allow_headers: "content-type,x-grpc-web,x-user-agent,grpc-timeout"
                        expose_headers: "grpc-status,grpc-message"
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb }
                  - name: envoy.filters.http.cors
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors }
                  - name: envoy.filters.http.router
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
  clusters:
    - name: zaino
      type: LOGICAL_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: UPSTREAM_HOST
          common_tls_context:
            alpn_protocols: ["h2"]
            validation_context:
              trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }
      load_assignment:
        cluster_name: zaino
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: UPSTREAM_HOST, port_value: 443 } } }
