# sealForge backend stack. See infra/README.md and docs/02-TRD.md §2.3.
#
#   Local dev (DB only):     docker compose -f infra/docker-compose.yml up -d postgres
#   Full node stack:         docker compose -f infra/docker-compose.yml --profile node up -d
#   Everything + coordinator docker compose -f infra/docker-compose.yml --profile node --profile app up -d

name: sealforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sealforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sealforge}
      POSTGRES_DB: sealforge
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sealforge"]
      interval: 5s
      retries: 10

  zebra:
    profiles: ["node"]
    image: ${ZEBRA_IMAGE:-zfnd/zebra:latest} # pin an NU7-capable tag in task 1.3
    environment:
      ZEBRA_NETWORK__NETWORK: ${ZEBRA_NETWORK:-Testnet}
      ZEBRA_RPC__LISTEN_ADDR: 0.0.0.0:18232
    volumes: [zebra-cache:/home/zebra/.cache/zebra]
    restart: unless-stopped

  zaino:
    profiles: ["node"]
    image: ${ZAINO_IMAGE:?set ZAINO_IMAGE to a pinned Zaino image (task 1.3)}
    depends_on: [zebra]
    # Exposes the lightwallet gRPC API on 8137 to the coordinator and Envoy.
    expose: ["8137"]
    restart: unless-stopped

  envoy:
    profiles: ["node"]
    image: envoyproxy/envoy:v1.31-latest
    depends_on: [zaino]
    volumes: ["./envoy.yaml:/etc/envoy/envoy.yaml:ro"]
    ports: ["127.0.0.1:8081:8081"]
    restart: unless-stopped

  coordinator:
    profiles: ["app"]
    image: ghcr.io/udoka-am/sealforge-coordinator:${SF_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/coordinator.Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://sealforge:${POSTGRES_PASSWORD:-sealforge}@postgres:5432/sealforge
      SF_ZAINO_URL: http://zaino:8137
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped

  caddy:
    profiles: ["app"]
    image: caddy:2-alpine
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data"]
    ports: ["80:80", "443:443"]
    restart: unless-stopped

volumes:
  pgdata:
  zebra-cache:
  caddy-data:
