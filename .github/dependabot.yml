version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # The librustzcash crates move together; update them as one PR.
      zcash:
        patterns:
          - "zcash_*"
          - "orchard"
          - "sapling-crypto"
          - "pczt"
          - "zip32"
          - "zip321"
      frost:
        patterns:
          - "frost-*"
          - "reddsa"
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The FROST ciphersuite (reddsa 0.5 / frost-core 3) and ed25519-dalek 2
      # are built on rand_core 0.6 and digest 0.10. A new major of these moves
      # the RNG and hash traits under the signing code, so they are upgraded by
      # hand together with the FROST crates (#60), not one at a time.
      - dependency-name: rand
        update-types: [version-update:semver-major]
      - dependency-name: ed25519-dalek
        update-types: [version-update:semver-major]
    labels: [dependencies, rust]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types follow the Node version in .nvmrc, which moves by hand.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    labels: [dependencies, javascript]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]

  - package-ecosystem: docker
    # infra/wasm-build stays pinned by digest on purpose: changing it changes
    # the committed WebAssembly modules, so it is updated by hand.
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    ignore:
      # The runtime image follows .nvmrc and CI; a new Node major moves all
      # three together, by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]
    labels: [dependencies, docker]
