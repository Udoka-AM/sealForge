name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sealforge
          POSTGRES_PASSWORD: sealforge
          POSTGRES_DB: sealforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sealforge" --health-interval 5s --health-retries 10
    env:
      # sqlx::test creates a fresh database per integration test on this server.
      DATABASE_URL: postgres://sealforge:sealforge@localhost:5432/sealforge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Auditor builds for WASM
        run: cargo check -p sealforge-auditor --target wasm32-unknown-unknown --no-default-features --features wasm

  wasm:
    # Builds every browser WebAssembly module from source. The scanner's
    # dependency tree includes secp256k1 (C), which needs a clang with the wasm32
    # target; Ubuntu's LLVM has it. The built modules are uploaded so the
    # committed copies in apps/web/public can be compared with a clean build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - name: Build auditor, signer, scanner and wallet
        env:
          LLVM_BIN: /usr/lib/llvm-18/bin
        run: |
          scripts/build-auditor-wasm.sh
          scripts/build-signer-wasm.sh
          scripts/build-scanner-wasm.sh
          scripts/build-wallet-wasm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-modules
          path: |
            apps/web/public/auditor
            apps/web/public/signer
            apps/web/public/scanner
            apps/web/public/wallet

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sealforge
          POSTGRES_PASSWORD: sealforge
          POSTGRES_DB: sealforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sealforge" --health-interval 5s --health-retries 10
    env:
      PGPASSWORD: sealforge
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: for f in migrations/*.sql; do psql -h localhost -U sealforge -d sealforge -v ON_ERROR_STOP=1 -f "$f"; done
      - name: Load dev seed
        run: psql -h localhost -U sealforge -d sealforge -v ON_ERROR_STOP=1 -f seed/dev.sql

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
