name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sealforge
          POSTGRES_PASSWORD: sealforge
          POSTGRES_DB: sealforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sealforge" --health-interval 5s --health-retries 10
    env:
      # sqlx::test creates a fresh database per integration test on this server.
      DATABASE_URL: postgres://sealforge:sealforge@localhost:5432/sealforge
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Auditor builds for WASM
        run: cargo check -p sealforge-auditor --target wasm32-unknown-unknown --no-default-features --features wasm

  wasm:
    # Rebuilds every browser WebAssembly module in the pinned container
    # (infra/wasm-build) and fails unless the committed modules are, byte for
    # byte, what their source builds to (review item D2, issue #61).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Committed modules record clean builds
        run: scripts/check-wasm-builds.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the pinned image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: infra/wasm-build
          tags: sealforge-wasm-build:ci
          platforms: linux/amd64
          load: true
          cache-from: type=gha,scope=wasm-build
          cache-to: type=gha,mode=max,scope=wasm-build
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/sealforge-wasm
          key: wasm-${{ hashFiles('Cargo.lock', 'infra/wasm-build/Dockerfile') }}
          restore-keys: wasm-
      - name: Rebuild auditor, signer, scanner and wallet
        env:
          WASM_BUILD_IMAGE: sealforge-wasm-build:ci
        run: |
          mkdir -p ~/.cache/sealforge-wasm
          WASM_CACHE_DIR=$HOME/.cache/sealforge-wasm scripts/build-wasm.sh
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/sealforge-wasm apps/web/public
      - name: Committed modules match the fresh build
        run: |
          if ! git diff --exit-code --stat -- 'apps/web/public/*/*.wasm' 'apps/web/public/*/*.js'; then
            echo "::error::A committed WebAssembly module isn't what its source builds to. Commit the source, run scripts/build-wasm.sh, and commit the result."
            exit 1
          fi
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: wasm-modules
          path: |
            apps/web/public/auditor
            apps/web/public/signer
            apps/web/public/scanner
            apps/web/public/wallet

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sealforge
          POSTGRES_PASSWORD: sealforge
          POSTGRES_DB: sealforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sealforge" --health-interval 5s --health-retries 10
    env:
      PGPASSWORD: sealforge
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Apply migrations
        run: for f in migrations/*.sql; do psql -h localhost -U sealforge -d sealforge -v ON_ERROR_STOP=1 -f "$f"; done
      - name: Load dev seed
        run: psql -h localhost -U sealforge -d sealforge -v ON_ERROR_STOP=1 -f seed/dev.sql

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
